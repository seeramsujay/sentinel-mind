<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Radar Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Neural Pulse Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <radialGradient id="radar-sweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0EA5E9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="792" height="792" x="4" y="4" rx="156" fill="none" stroke="#1E293B" stroke-width="3" />

  <!-- Tactical Radar Grids -->
  <circle cx="400" cy="380" r="260" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="400" cy="380" r="190" fill="none" stroke="#334155" stroke-width="1.5" />
  <circle cx="400" cy="380" r="120" fill="url(#radar-sweep)" stroke="#059669" stroke-width="2" />
  <circle cx="400" cy="380" r="50" fill="none" stroke="#10B981" stroke-width="2" opacity="0.6" />

  <!-- Radar Crosshairs -->
  <line x1="140" y1="380" x2="660" y2="380" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />
  <line x1="400" y1="120" x2="400" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />

  <!-- Tactical Hex Shield Perimeter -->
  <polygon points="400,160 580,260 580,480 400,590 220,480 220,260" 
           fill="none" stroke="url(#shield-grad)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Autonomous Signal Deduplication Lattice / Nodes -->
  <!-- Center Core Node (Meta-Orchestrator) -->
  <circle cx="400" cy="380" r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="4" filter="url(#glow)" />
  <circle cx="400" cy="380" r="14" fill="#38BDF8" />

  <!-- Outer Emergency Nodes -->
  <g stroke="#38BDF8" stroke-width="2" opacity="0.8">
    <line x1="400" y1="380" x2="310" y2="280" />
    <line x1="400" y1="380" x2="490" y2="280" />
    <line x1="400" y1="380" x2="490" y2="470" />
    <line x1="400" y1="380" x2="310" y2="470" />
  </g>

  <!-- SOS Clusters (Merged into Triage) -->
  <circle cx="310" cy="280" r="16" fill="#EF4444" filter="url(#glow)" />
  <circle cx="490" cy="280" r="16" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="490" cy="470" r="16" fill="#10B981" filter="url(#glow)" />
  <circle cx="310" cy="470" r="16" fill="#6366F1" filter="url(#glow)" />

  <!-- Eye of the Sentinel Aperture -->
  <path d="M 280,380 Q 400,290 520,380 Q 400,470 280,380 Z" fill="none" stroke="#F8FAFC" stroke-width="3" opacity="0.85" />
  <circle cx="400" cy="380" r="42" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Typography Brand Mark -->
  <text x="400" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#F8FAFC" text-anchor="middle" letter-spacing="9">SENTINEL-MIND</text>
  <text x="400" y="726" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#94A3B8" text-anchor="middle" letter-spacing="4">AUTONOMOUS MULTI-AGENT DISASTER RESPONSE</text>
</svg>
